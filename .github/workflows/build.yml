name: Java CI
on: [push]
jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                java: [22, 23, 24]
        steps:
            - uses: actions/checkout@v5
            - name: Cache
              uses: actions/cache@v4
              with:
                path: ~/.m2/repository
                key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
                restore-keys: |
                    ${{ runner.os }}-maven-
            - name: Set up JDK
              uses: actions/setup-java@v4
              with:
                distribution: graalvm
                java-version: ${{ matrix.java }}
            - name: Build with Maven
              run: ./benchmarks-as-tests/mvnw --batch-mode --no-transfer-progress -Djava.version=${{ matrix.java }} -f benchmarks-as-tests/pom.xml verify | cat

